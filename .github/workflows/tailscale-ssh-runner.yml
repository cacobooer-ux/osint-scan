name: Ubuntu Tailscale SSH Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OpenSSH server and tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server curl git zstd openssl
      - name: Restore latest ReVBS system snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REVBS_BACKUP_KEY: ${{ secrets.REVBS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$(mktemp -d)"
          if git clone --depth 1 --branch revbs-backup "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BACKUP_DIR/repo" 2>/dev/null; then
            if [[ -s "$BACKUP_DIR/repo/backups/system-latest.tar.zst.enc" ]]; then
              echo 'Restoring latest ReVBS snapshot...'
              printf '%s' "$REVBS_BACKUP_KEY" | sudo tee "$BACKUP_DIR/key" >/dev/null
              sudo chmod 600 "$BACKUP_DIR/key"
              sudo sh -c "openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass file='$BACKUP_DIR/key' -in '$BACKUP_DIR/repo/backups/system-latest.tar.zst.enc' | zstd -d | tar --extract --absolute-names --preserve-permissions --same-owner -C /"
              echo 'ReVBS snapshot restored.'
            else
              echo 'No ReVBS snapshot found; starting from a clean runner.'
            fi
          else
            echo 'No revbs-backup branch found; starting from a clean runner.'
          fi
          rm -rf "$BACKUP_DIR"
      - name: Configure OpenSSH
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo install -d -m 700 -o runner -g runner /home/runner/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" | sudo tee /home/runner/.ssh/authorized_keys >/dev/null
          sudo chown runner:runner /home/runner/.ssh/authorized_keys
          sudo chmod 600 /home/runner/.ssh/authorized_keys
          printf 'runner:%s\n' "$SSH_PASSWORD" | sudo chpasswd
          printf '%s\n' 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          printf '%s\n' 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config.d/runner-password.conf >/dev/null
          sudo install -d -m 0755 /run/sshd
          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="gh-ubuntu-${GITHUB_RUN_ID}"
          IP="$(tailscale ip -4 | head -n1)"
          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "SSH_COMMAND=ssh runner@$IP" >> "$GITHUB_ENV"
          echo "========================================"
          echo "TAILSCALE_IP=$IP"
          echo "SSH_COMMAND=ssh runner@$IP"
          echo "========================================"
      - name: Publish runner connection status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="RUN_ID=$GITHUB_RUN_ID\nTAILSCALE_IP=$TAILSCALE_IP\nSSH_COMMAND=ssh runner@$TAILSCALE_IP\nSTATUS=ready\n"
          CONTENT="$(printf '%b' "$STATUS" | base64 -w 0)"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/runner-status/$GITHUB_RUN_ID.txt" \
            -d "{\"message\":\"Publish runner connection status\",\"content\":\"$CONTENT\"}"
      - name: Show runner status
        run: |
          set -e
          echo "Runner: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "SSH service:"
          sudo systemctl --no-pager --full status ssh || true
          echo "Listening ports:"
          ss -lnt
      - name: Keep SSH runner alive
        env:
          GH_TOKEN: ${{ github.token }}
          REVBS_BACKUP_KEY: ${{ secrets.REVBS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          backup_once() {
            work="$(mktemp -d)"
            sudo tar --create --zstd --file "$work/system.tar.zst" \
              --absolute-names --ignore-failed-read --warning=no-file-changed \
              --exclude=/proc --exclude=/sys --exclude=/dev --exclude=/run \
              --exclude=/tmp --exclude=/var/tmp --exclude=/var/cache/apt \
              --exclude=/var/lib/apt/lists --exclude=/home/runner/.cache \
              --exclude=/home/runner/.git --exclude=/home/runner/work \
              --exclude=/home/runner/_work --exclude=/tmp/* /
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
              -pass env:REVBS_BACKUP_KEY -in "$work/system.tar.zst" \
              -out "$work/system-latest.tar.zst.enc"
            size="$(stat -c '%s' "$work/system-latest.tar.zst.enc")"
            if (( size > 70000000 )); then
              echo "ReVBS backup is ${size} bytes; refusing upload above 70 MB."
              rm -rf "$work"
              return 1
            fi
            mkdir -p "$work/repo/backups"
            cp "$work/system-latest.tar.zst.enc" "$work/repo/backups/system-latest.tar.zst.enc"
            printf '{\"run_id\":\"%s\",\"created_at\":\"%s\",\"bytes\":%s,\"format\":\"tar.zst.enc\",\"scope\":\"practical-system\"}\n' \
              "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$size" > "$work/repo/backups/checkpoint.json"
            cd "$work/repo"
            git init -q -b revbs-backup
            git config user.name 'ReVBS Backup'
            git config user.email 'revbs-backup@users.noreply.github.com'
            git add backups
            git commit -qm "ReVBS snapshot ${GITHUB_RUN_ID}"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q origin HEAD:refs/heads/revbs-backup --force
            rm -rf "$work"
            echo "ReVBS backup updated: ${size} bytes"
          }
          backup_once || echo 'Initial ReVBS backup failed; retrying in 10 minutes.'
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] SSH runner alive at $TAILSCALE_IP"
            sleep 600
            backup_once || echo 'ReVBS backup attempt failed; the SSH runner will continue.'
          done
